# Configuración de SonarQube para el Sistema Web Clínico Veterinario CIAC
sonar.projectKey=proyecto-veterinaria-ciac
sonar.projectName=Sistema Web Clinico Veterinario CIAC
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=config,usuarios,pacientes,citas,historiales,inventario,diagnostico,reportes,templates
sonar.exclusions=**/migrations/**,**/venv/**,**/static/**,**/__pycache__/**,**/*.joblib,**/test_*.py,**/tests.py
sonar.tests=usuarios,pacientes,citas,historiales,inventario,diagnostico
sonar.test.inclusions=**/test_*.py,**/tests.py

# Informe de cobertura generado con coverage.py (ver README_PRUEBAS_NFR.md)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
